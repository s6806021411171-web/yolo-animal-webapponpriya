<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Segmenter & Detector</title>
    <!-- โหลดฟอนต์ Kanit / Sarabun และ ONNX Runtime Web -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f4f7fb;
            color: #1e293b;
            padding: 32px 40px;
        }
        .page-wrapper {
            max-width: 1220px;
            margin: 0 auto;
        }
        h1 {
            font-size: 46px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.5px;
            line-height: 1.15;
        }
        .subtitle {
            color: #64748b;
            font-size: 16px;
            margin-top: 6px;
            margin-bottom: 24px;
        }
        .layout {
            display: grid;
            grid-template-columns: 310px 1fr;
            gap: 24px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
            border: 1px solid #eef2f6;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 14px;
            color: #0f172a;
        }
        .model-status {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 13.5px;
            color: #334155;
            line-height: 1.45;
            margin-bottom: 14px;
            word-break: break-all;
        }
        .dot-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #10b981;
            margin-top: 5px;
            flex-shrink: 0;
        }
        .dot-status.loading { background-color: #f59e0b; }
        .dot-status.error { background-color: #ef4444; }

        .model-select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-family: inherit;
            font-size: 13.5px;
            margin-bottom: 12px;
            background: #f8fafc;
            color: #1e293b;
        }

        .btn-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 18px;
            border-radius: 999px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #dbe2ea;
            background: #ffffff;
            color: #1e3a8a;
            transition: all 0.15s ease;
        }
        .btn-pill:hover:not(:disabled) {
            background: #f1f5f9;
        }
        .btn-pill:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-primary {
            background: #1d63dc;
            color: #ffffff;
            border-color: #1d63dc;
        }
        .btn-primary:hover:not(:disabled) {
            background: #154eb5;
        }
        .link-reset {
            display: inline-block;
            margin-top: 12px;
            font-size: 13px;
            color: #64748b;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }
        .link-reset:hover { color: #0f172a; }

        .setting-label {
            font-size: 13.5px;
            color: #64748b;
            margin-bottom: 8px;
            display: block;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .slider-row input[type="range"] {
            flex: 1;
            accent-color: #1d63dc;
            cursor: pointer;
        }
        .conf-val {
            font-weight: 700;
            color: #1d63dc;
            font-size: 16px;
            min-width: 38px;
            text-align: right;
        }

        .class-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .class-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .class-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .class-idx {
            font-size: 13.5px;
            color: #475569;
            width: 14px;
            font-family: monospace;
        }
        .class-input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            font-family: monospace;
            font-size: 13.5px;
            color: #0f172a;
        }

        .top-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        .canvas-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
            border: 1px solid #eef2f6;
            min-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            display: none;
        }
        .empty-hint {
            color: #94a3b8;
            font-size: 15px;
            text-align: center;
            padding: 60px 20px;
        }
        .footer-stats {
            margin-top: 12px;
            font-size: 14.5px;
            color: #475569;
            padding-left: 4px;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <h1>Animal Onpriya_6806021411171</h1>
        <p class="subtitle">ทายภาพ butterfly, sheep, spider และ squirrel ด้วยโมเดล YOLO26n-seg และ YOLO26n</p>

        <div class="layout">
            <!-- แถบเมนูด้านซ้าย -->
            <div class="sidebar">
                <div class="card">
                    <div class="card-title">โมเดล</div>
                    <div class="model-status">
                        <span id="status-dot" class="dot-status loading"></span>
                        <span id="status-text">กำลังโหลดโมเดล...</span>
                    </div>

                    <!-- เลือกสลับระหว่างโมเดล Polygon และ Rectangle ที่มีในโปรเจกต์ -->
                    <select id="preset-model" class="model-select">
                        <option value="./best_web_model/best_p.onnx">best_p.onnx (Polygon - Seg)</option>
                        <option value="./best_web_model/best_r.onnx">best_r.onnx (Rectangle - Det)</option>
                    </select>

                    <!-- ปุ่มเลือกไฟล์ .onnx จากเครื่องเพิ่มเติม -->
                    <input type="file" id="onnx-upload" accept=".onnx" style="display:none;">
                    <button class="btn-pill" onclick="document.getElementById('onnx-upload').click()">เลือกไฟล์ .onnx</button>
                    <br>
                    <button class="link-reset" id="reset-model-btn">ล้างโมเดลที่จำไว้</button>
                </div>

                <div class="card">
                    <div class="card-title">ตั้งค่าการทาย</div>
                    <span class="setting-label">ความมั่นใจขั้นต่ำ</span>
                    <div class="slider-row">
                        <input type="range" id="conf-slider" min="0.05" max="0.95" step="0.05" value="0.25">
                        <span class="conf-val" id="conf-value">0.25</span>
                    </div>

                    <span class="setting-label">ชื่อคลาส (ตามลำดับ index ของโมเดล)</span>
                    <div class="class-list">
                        <div class="class-item">
                            <span class="class-dot" style="background:#ef5323;"></span>
                            <span class="class-idx">0</span>
                            <input type="text" class="class-input" data-idx="0" value="butterfly">
                        </div>
                        <div class="class-item">
                            <span class="class-dot" style="background:#2bb673;"></span>
                            <span class="class-idx">1</span>
                            <input type="text" class="class-input" data-idx="1" value="sheep">
                        </div>
                        <div class="class-item">
                            <span class="class-dot" style="background:#facc15;"></span>
                            <span class="class-idx">2</span>
                            <input type="text" class="class-input" data-idx="2" value="spider">
                        </div>
                        <div class="class-item">
                            <span class="class-dot" style="background:#6366f1;"></span>
                            <span class="class-idx">3</span>
                            <input type="text" class="class-input" data-idx="3" value="squirrel">
                        </div>
                    </div>
                </div>
            </div>

            <!-- พื้นที่แสดงผลด้านขวา -->
            <div class="main-area">
                <div class="top-actions">
                    <input type="file" id="image-upload" accept="image/*" style="display:none;">
                    <button class="btn-pill btn-primary" id="btn-choose-img" onclick="document.getElementById('image-upload').click()" disabled>เลือกรูป</button>
                    <button class="btn-pill" id="btn-rerun" disabled>ทายอีกครั้ง</button>
                    <button class="btn-pill" id="btn-save-img" disabled>บันทึกรูปผลลัพธ์</button>
                </div>

                <div class="canvas-card">
                    <div id="empty-hint" class="empty-hint">กดปุ่ม <b>"เลือกรูป"</b> ด้านบนเพื่ออัปโหลดภาพสัตว์ที่ต้องการทายผล</div>
                    <canvas id="canvas"></canvas>
                </div>

                <div class="footer-stats" id="footer-stats">ยังไม่ได้เลือกรูปภาพ</div>
            </div>
        </div>
    </div>

    <script>
        // สีประจำแต่ละคลาส (ตรงกับจุดสีด้านซ้าย)
        const COLORS = [
            [239, 83, 35],   // 0: ส้มแดง (butterfly)
            [43, 182, 115],  // 1: เขียว (sheep)
            [250, 204, 21],  // 2: เหลือง (spider)
            [99, 102, 241]   // 3: ม่วงน้ำเงิน (squirrel)
        ];

        let session = null;
        let currentImage = null;
        let lastPredictionsJSON = [];

        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const presetModelEl = document.getElementById('preset-model');
        const onnxUploadEl = document.getElementById('onnx-upload');
        const resetModelBtn = document.getElementById('reset-model-btn');
        const confSlider = document.getElementById('conf-slider');
        const confValue = document.getElementById('conf-value');
        const imageUploadEl = document.getElementById('image-upload');
        const btnChooseImg = document.getElementById('btn-choose-img');
        const btnRerun = document.getElementById('btn-rerun');
        const btnSaveImg = document.getElementById('btn-save-img');
        const btnSaveJson = document.getElementById('btn-save-json');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const emptyHint = document.getElementById('empty-hint');
        const footerStats = document.getElementById('footer-stats');

        function getClassNames() {
            const inputs = document.querySelectorAll('.class-input');
            return Array.from(inputs).map(el => el.value.trim() || `class_${el.dataset.idx}`);
        }

        // 1. ฟังก์ชันโหลดโมเดล (รองรับทั้ง Path และ ArrayBuffer จากไฟล์ที่เลือกเอง)
        async function loadModel(source, displayName) {
            statusDot.className = 'dot-status loading';
            statusText.innerText = `กำลังโหลด: ${displayName}...`;
            btnChooseImg.disabled = true;
            try {
                session = await ort.InferenceSession.create(source);
                const outputs = session.outputNames.join(', ');
                statusDot.className = 'dot-status';
                statusText.innerText = `โหลดแล้ว: ${displayName} | outputs: ${outputs}`;
                btnChooseImg.disabled = false;

                if (currentImage) {
                    runInference(currentImage);
                }
            } catch (err) {
                statusDot.className = 'dot-status error';
                statusText.innerText = `โหลดไม่สำเร็จ (${displayName}) กรุณาตรวจสอบไฟล์โมเดล`;
                console.error(err);
            }
        }

        // โหลดโมเดลเริ่มต้นตามที่เลือกไว้
        loadModel(presetModelEl.value, 'best_p.onnx');

        // เมื่อเปลี่ยนโมเดลจาก Dropdown
        presetModelEl.addEventListener('change', (e) => {
            const name = e.target.value.split('/').pop();
            loadModel(e.target.value, name);
        });

        // เมื่อกดปุ่ม "เลือกไฟล์ .onnx" จากเครื่อง
        onnxUploadEl.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const buffer = await file.arrayBuffer();
            loadModel(buffer, file.name);
        });

        // เมื่อกด "ล้างโมเดลที่จำไว้" ให้กลับไปโหลดค่าเริ่มต้น
        resetModelBtn.addEventListener('click', () => {
            presetModelEl.selectedIndex = 0;
            loadModel(presetModelEl.value, 'best_p.onnx');
        });

        // อัปเดตตัวเลขความมั่นใจขั้นต่ำ
        confSlider.addEventListener('input', (e) => {
            confValue.innerText = parseFloat(e.target.value).toFixed(2);
        });
        confSlider.addEventListener('change', () => {
            if (currentImage && session) runInference(currentImage);
        });

        // เมื่อแก้ไขชื่อคลาส ให้วาดผลใหม่ทันที
        document.querySelectorAll('.class-input').forEach(input => {
            input.addEventListener('change', () => {
                if (currentImage && session) runInference(currentImage);
            });
        });

        // 2. เมื่อเลือกรูปภาพ
        imageUploadEl.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const img = new Image();
            img.onload = () => {
                currentImage = img;
                emptyHint.style.display = 'none';
                canvas.style.display = 'block';
                btnRerun.disabled = false;
                btnSaveImg.disabled = false;
                btnSaveJson.disabled = false;
                runInference(img);
            };
            img.src = URL.createObjectURL(file);
        });

        // ปุ่ม "ทายอีกครั้ง"
        btnRerun.addEventListener('click', () => {
            if (currentImage && session) runInference(currentImage);
        });

        // ปุ่ม "บันทึกรูปผลลัพธ์"
        btnSaveImg.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'prediction_result.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // ปุ่ม "บันทึก polygon (JSON)"
        btnSaveJson.addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(lastPredictionsJSON, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.download = 'predictions_polygon.json';
            link.href = URL.createObjectURL(blob);
            link.click();
        });

        // 3. ประมวลผลภาพและจับเวลา
        async function runInference(img) {
            footerStats.innerText = 'กำลังประมวลผล...';
            const t0 = performance.now();

            // เตรียม Canvas ขนาด 640x640 สำหรับป้อนเข้าโมเดล YOLO
            const offCanvas = document.createElement('canvas');
            offCanvas.width = 640;
            offCanvas.height = 640;
            const offCtx = offCanvas.getContext('2d');
            offCtx.drawImage(img, 0, 0, 640, 640);
            const imgData = offCtx.getImageData(0, 0, 640, 640).data;

            const input = new Float32Array(3 * 640 * 640);
            for (let i = 0; i < 640 * 640; i++) {
                input[i] = imgData[i * 4] / 255.0;
                input[i + 640 * 640] = imgData[i * 4 + 1] / 255.0;
                input[i + 2 * 640 * 640] = imgData[i * 4 + 2] / 255.0;
            }

            const tensor = new ort.Tensor('float32', input, [1, 3, 640, 640]);
            const feeds = { [session.inputNames[0]]: tensor };
            const results = await session.run(feeds);

            const output0Tensor = results[session.outputNames[0]];
            const protoTensor = session.outputNames.length > 1 ? results[session.outputNames[1]] : null;

            const count = drawResults(img, output0Tensor, protoTensor);
            const elapsedMs = Math.round(performance.now() - t0);

            footerStats.innerText = `พบ ${count} วัตถุ ใช้เวลา ${elapsedMs} ms`;
        }

        // 4. วาดภาพตามสัดส่วนจริง พร้อมระบายสี Mask และกรอบ Bounding Box
        function drawResults(img, output0Tensor, protoTensor) {
            const confThreshold = parseFloat(confSlider.value);
            const classNames = getClassNames();
            const output0 = output0Tensor.data;
            const dims = output0Tensor.dims;
            const proto = protoTensor ? protoTensor.data : null;

            // ตั้งขนาด Canvas ให้คงสัดส่วนภาพจริง (ความกว้างสูงสุด 900px เพื่อความคมชัดและรวดเร็ว)
            const maxW = 900;
            const scale = img.naturalWidth > maxW ? maxW / img.naturalWidth : 1;
            const dispW = Math.round(img.naturalWidth * scale);
            const dispH = Math.round(img.naturalHeight * scale);
            canvas.width = dispW;
            canvas.height = dispH;

            ctx.drawImage(img, 0, 0, dispW, dispH);

            let selected = [];

            // แกะพิกัดจาก Tensor (รองรับทั้ง YOLO26 End-to-End [1, 300, 6/38] และ [1, C, 8400])
            if (dims[1] === 300) {
                const stride = dims[2];
                for (let i = 0; i < 300; i++) {
                    const offset = i * stride;
                    const score = output0[offset + 4];
                    if (score >= confThreshold) {
                        const x1 = output0[offset + 0];
                        const y1 = output0[offset + 1];
                        const x2 = output0[offset + 2];
                        const y2 = output0[offset + 3];
                        const classId = Math.round(output0[offset + 5]);
                        const maskWeights = [];
                        if (proto && stride >= 38) {
                            for (let m = 0; m < 32; m++) {
                                maskWeights.push(output0[offset + 6 + m]);
                            }
                        }
                        selected.push({ x1, y1, x2, y2, score, classId, maskWeights });
                    }
                }
            } else {
                const numAnchors = dims[2];
                const numClasses = 4;
                const boxes = [];

                for (let i = 0; i < numAnchors; i++) {
                    let maxScore = 0;
                    let classId = 0;
                    for (let c = 0; c < numClasses; c++) {
                        const score = output0[(4 + c) * numAnchors + i];
                        if (score > maxScore) {
                            maxScore = score;
                            classId = c;
                        }
                    }

                    if (maxScore >= confThreshold) {
                        const cx = output0[0 * numAnchors + i];
                        const cy = output0[1 * numAnchors + i];
                        const w = output0[2 * numAnchors + i];
                        const h = output0[3 * numAnchors + i];
                        const x1 = cx - w / 2;
                        const y1 = cy - h / 2;
                        const x2 = cx + w / 2;
                        const y2 = cy + h / 2;

                        const maskWeights = [];
                        if (proto) {
                            for (let m = 0; m < 32; m++) {
                                maskWeights.push(output0[(8 + m) * numAnchors + i]);
                            }
                        }
                        boxes.push({ x1, y1, x2, y2, score: maxScore, classId, maskWeights });
                    }
                }

                boxes.sort((a, b) => b.score - a.score);
                while (boxes.length > 0) {
                    const current = boxes.shift();
                    selected.push(current);
                    for (let i = boxes.length - 1; i >= 0; i--) {
                        if (iou(current, boxes[i]) > 0.45) {
                            boxes.splice(i, 1);
                        }
                    }
                }
            }

            lastPredictionsJSON = [];

            // วาดระบายสี Segmentation Mask และเก็บพิกัด Polygon
            if (proto && selected.length > 0) {
                const canvasData = ctx.getImageData(0, 0, dispW, dispH);
                const pixels = canvasData.data;

                for (const det of selected) {
                    if (det.maskWeights.length === 0) continue;
                    const color = COLORS[det.classId] || [239, 83, 35];

                    // คำนวณ Mask ขนาด 160x160 เฉพาะในกรอบของวัตถุ
                    const mx1 = Math.max(0, Math.floor(det.x1 / 4));
                    const my1 = Math.max(0, Math.floor(det.y1 / 4));
                    const mx2 = Math.min(160, Math.ceil(det.x2 / 4));
                    const my2 = Math.min(160, Math.ceil(det.y2 / 4));

                    const maskGrid = new Uint8Array(160 * 160);
                    const polygonPoints = [];

                    for (let py = my1; py < my2; py++) {
                        for (let px = mx1; px < mx2; px++) {
                            let sum = 0;
                            const protoIdx = py * 160 + px;
                            for (let m = 0; m < 32; m++) {
                                sum += det.maskWeights[m] * proto[m * 25600 + protoIdx];
                            }
                            if (1 / (1 + Math.exp(-sum)) > 0.5) {
                                maskGrid[ protoIdx ] = 1;
                            }
                        }
                    }

                    // เก็บจุดขอบ Polygon สำหรับส่งออกไฟล์ JSON
                    for (let py = my1; py < my2; py++) {
                        for (let px = mx1; px < mx2; px++) {
                            if (maskGrid[py * 160 + px] === 1) {
                                const isEdge = (px === mx1 || px === mx2 - 1 || py === my1 || py === my2 - 1 ||
                                    maskGrid[py * 160 + (px - 1)] === 0 ||
                                    maskGrid[py * 160 + (px + 1)] === 0 ||
                                    maskGrid[(py - 1) * 160 + px] === 0 ||
                                    maskGrid[(py + 1) * 160 + px] === 0);
                                if (isEdge) {
                                    polygonPoints.push([
                                        Math.round((px / 160) * dispW),
                                        Math.round((py / 160) * dispH)
                                    ]);
                                }
                            }
                        }
                    }
                    det.polygon = polygonPoints;

                    // ระบายสี Mask ลงบนภาพตามสัดส่วนจริง
                    const sx1 = Math.max(0, Math.floor((det.x1 / 640) * dispW));
                    const sy1 = Math.max(0, Math.floor((det.y1 / 640) * dispH));
                    const sx2 = Math.min(dispW, Math.ceil((det.x2 / 640) * dispW));
                    const sy2 = Math.min(dispH, Math.ceil((det.y2 / 640) * dispH));

                    for (let y = sy1; y < sy2; y++) {
                        const py = Math.min(159, Math.floor((y / dispH) * 160));
                        for (let x = sx1; x < sx2; x++) {
                            const px = Math.min(159, Math.floor((x / dispW) * 160));
                            if (maskGrid[py * 160 + px] === 1) {
                                const idx = (y * dispW + x) * 4;
                                pixels[idx] = Math.round(pixels[idx] * 0.55 + color[0] * 0.45);
                                pixels[idx + 1] = Math.round(pixels[idx + 1] * 0.55 + color[1] * 0.45);
                                pixels[idx + 2] = Math.round(pixels[idx + 2] * 0.55 + color[2] * 0.45);
                            }
                        }
                    }
                }
                ctx.putImageData(canvasData, 0, 0);
            }

            // วาดกรอบสี่เหลี่ยมและป้ายชื่อคลาสสไตล์เดียวกับภาพตัวอย่าง
            for (const det of selected) {
                const color = COLORS[det.classId] || [239, 83, 35];
                const rgb = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
                const rgbaBg = `rgba(${color[0]}, ${color[1]}, ${color[2]}, 0.85)`;

                const bx1 = (det.x1 / 640) * dispW;
                const by1 = (det.y1 / 640) * dispH;
                const bw = ((det.x2 - det.x1) / 640) * dispW;
                const bh = ((det.y2 - det.y1) / 640) * dispH;

                ctx.strokeStyle = rgb;
                ctx.lineWidth = 2.5;
                ctx.strokeRect(bx1, by1, bw, bh);

                const clsName = classNames[det.classId] || `class_${det.classId}`;
                const label = `${clsName} ${det.score.toFixed(2)}`;
                ctx.font = '600 15px Prompt, sans-serif';
                const textW = ctx.measureText(label).width;

                const labelY = by1 > 28 ? by1 - 28 : by1;
                ctx.fillStyle = rgbaBg;
                ctx.fillRect(bx1, labelY, textW + 14, 26);

                ctx.fillStyle = '#0f172a';
                ctx.fillText(label, bx1 + 7, labelY + 18);

                lastPredictionsJSON.push({
                    class_id: det.classId,
                    class_name: clsName,
                    confidence: Number(det.score.toFixed(4)),
                    bbox: [Math.round(bx1), Math.round(by1), Math.round(bx1 + bw), Math.round(by1 + bh)],
                    polygon: det.polygon || []
                });
            }

            return selected.length;
        }

        function iou(a, b) {
            const x1 = Math.max(a.x1, b.x1);
            const y1 = Math.max(a.y1, b.y1);
            const x2 = Math.min(a.x2, b.x2);
            const y2 = Math.min(a.y2, b.y2);
            const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
            const areaA = (a.x2 - a.x1) * (a.y2 - a.y1);
            const areaB = (b.x2 - b.x1) * (b.y2 - b.y1);
            return inter / (areaA + areaB - inter);
        }
    </script>
